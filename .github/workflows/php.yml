name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_DATABASE: sume_db
      DB_USERNAME: root
      DB_PASSWORD: root
      CONFIRMATION_DEADLINE: ""
      # E-mails vão para storage/logs/mail.log e o Google é um servidor falso (tests/fake-google.php)
      MAIL_DRIVER: log
      GOOGLE_CLIENT_ID: test-client
      GOOGLE_CLIENT_SECRET: test-secret
      GOOGLE_AUTH_URL: http://127.0.0.1:8766/auth
      GOOGLE_TOKEN_URL: http://127.0.0.1:8766/token

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, fileinfo, gd
          tools: composer

      - name: Validar composer.json
        run: composer validate --no-check-publish  # é uma aplicação, não um pacote publicável

      - name: Lint (sintaxe de todos os arquivos PHP)
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Rotas com APP_URL em subpasta (cenário XAMPP)
        run: APP_URL=http://localhost:8080/SUME php tests/paths.php

      - name: Criar banco
        run: mysql -h 127.0.0.1 -uroot -proot < database/schema.sql

      - name: Criar administrador de teste
        run: SUME_ADMIN_PASSWORD=Admin1234 php bin/create-admin.php "Admin CI" admin@teste.com

      - name: Subir servidor
        run: |
          php -S 127.0.0.1:8766 tests/fake-google.php > fake-google.log 2>&1 &
          php -S 127.0.0.1:8765 -t public public/index.php > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 0.5; done

      - name: Teste de fumaça (ponta a ponta)
        run: bash tests/smoke.sh

      - name: Log do servidor (se falhar)
        if: failure()
        run: cat server.log fake-google.log
